name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"     # Runs every 12 hours automatically
  workflow_dispatch:             # Allows manual trigger from Actions tab
  push:
    branches:
      - main
      - master

permissions:
  contents: write              # Required to push to the output branch

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate Light & Dark Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#22d3ee&color_dots=#ebedf0,#0e4429,#006d32,#0284c7,#38bdf8
            dist/github-contribution-grid-snake-dark.svg?color_snake=#22d3ee&color_dots=#161b22,#0e4429,#006d32,#0284c7,#38bdf8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Glowing Style Effects
        run: |
          python -c "
          import re, os
          for filename in ['github-contribution-grid-snake.svg', 'github-contribution-grid-snake-dark.svg']:
              path = os.path.join('dist', filename)
              if not os.path.exists(path):
                  continue
              print(f'Processing {path}...')
              with open(path, 'r', encoding='utf-8') as f:
                  svg = f.read()
              
              # Add rx/ry rounded corners to cells
              svg = re.sub(r'\.c\{([^}]+)\}', r'.c{\1;rx:3px;ry:3px}', svg)
              
              # Add glow to snake
              svg = re.sub(r'\.s\{([^}]+)\}', r'.s{\1;filter:drop-shadow(0 0 6px var(--cs)) drop-shadow(0 0 2px var(--cs))}', svg)
              
              # Add glow to active keyframe cells
              svg = re.sub(r'([0-9.]+)%\{fill:(var\(--c[1-4]\))\}', r'\1%{fill:\2;filter:drop-shadow(0 0 5px \2) drop-shadow(0 0 2px \2)}', svg)
              
              # Remove glow when cell is eaten/empty
              svg = re.sub(r'([0-9.]+)%,100%\{fill:var\(--ce\)\}', r'\1%,100%{fill:var(--ce);filter:none}', svg)
              
              # Add glow to initial classes
              svg = re.sub(r'\.c\.(c[0-9a-z]+)\{fill:(var\(--c[1-4]\));', r'.c.\1{fill:\2;filter:drop-shadow(0 0 5px \2) drop-shadow(0 0 2px \2);', svg)
              
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(svg)
              print(f'Successfully processed {filename}')
          "

      - name: Push Snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true   # Keep existing files — never wipe
          jekyll: false        # Disable Jekyll so SVGs are served raw
          commit_message: "chore: regenerate contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
