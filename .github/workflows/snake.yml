name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"     # Runs every 12 hours automatically
  workflow_dispatch:             # Allows manual trigger from Actions tab
  push:
    branches:
      - main
      - master

permissions:
  contents: write              # Required to push to the output branch

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate Light & Dark Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#22d3ee&color_dots=#ebedf0,#0e4429,#006d32,#0284c7,#38bdf8
            dist/github-contribution-grid-snake-dark.svg?color_snake=#22d3ee&color_dots=#161b22,#0e4429,#006d32,#0284c7,#38bdf8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Glowing Style Effects
        run: |
          python -c "
          import re, os
          for filename in ['github-contribution-grid-snake.svg', 'github-contribution-grid-snake-dark.svg']:
              path = os.path.join('dist', filename)
              if not os.path.exists(path):
                  continue
              print(f'Processing {path}...')
              with open(path, 'r', encoding='utf-8') as f:
                  svg = f.read()
              
              is_dark = 'dark' in filename
              bg_color = '#020817' if is_dark else '#f8fafc'
              star_opacity = 'opacity: 0.3;' if is_dark else 'display: none;'
              title_color = '#38bdf8' if is_dark else '#0f172a'
              subtitle_color = '#475569' if is_dark else '#64748b'
              hud_bg = '#0f172a' if is_dark else '#ffffff'
              hud_stroke = 'rgba(56, 189, 248, 0.2)' if is_dark else 'rgba(15, 23, 42, 0.1)'
              hud_label_color = '#94a3b8' if is_dark else '#475569'
              hud_val_color = '#22d3ee' if is_dark else '#0284c7'
              border_color = '#22d3ee' if is_dark else '#0284c7'
              border_shadow = 'drop-shadow(0 0 3px #22d3ee)' if is_dark else 'drop-shadow(0 0 2px #0284c7)'
              footer_text_color = '#475569' if is_dark else '#64748b'
              key_bg = '#0f172a' if is_dark else '#ffffff'
              key_stroke = '#1e293b' if is_dark else '#e2e8f0'
              key_text_color = '#475569'
              
              # Adjust viewBox from -16 -32 880 192 to -40 -160 960 400
              svg = re.sub(
                  r'<svg\s+viewBox=\"-16\s+-32\s+880\s+192\"\s+width=\"880\"\s+height=\"192\"',
                  r'<svg viewBox=\"-40 -160 960 400\" width=\"960\" height=\"400\"',
                  svg
              )
              
              # Insert New CSS rules into <style> block
              new_css = f'''
              /* UI Styling */
              .bg {{ fill: {bg_color}; }}
              .title {{ font-family: \"Space Grotesk\", system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 700; fill: {title_color}; text-anchor: middle; letter-spacing: 2px; }}
              .subtitle {{ font-family: \"Space Grotesk\", system-ui, -apple-system, sans-serif; font-size: 12px; fill: {subtitle_color}; text-anchor: middle; }}
              .hud-box {{ fill: {hud_bg}; stroke: {hud_stroke}; stroke-width: 1px; rx: 8px; ry: 8px; }}
              .hud-label {{ font-family: \"Space Grotesk\", system-ui, -apple-system, sans-serif; font-size: 12px; fill: {hud_label_color}; }}
              .hud-val {{ font-family: \"Space Grotesk\", system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: {hud_val_color}; }}
              .grid-border {{ fill: none; stroke: {border_color}; stroke-width: 1.5px; rx: 12px; ry: 12px; filter: {border_shadow}; }}
              .footer-text {{ font-family: \"Space Grotesk\", system-ui, -apple-system, sans-serif; font-size: 11px; fill: {footer_text_color}; }}
              .key-box {{ fill: {key_bg}; stroke: {key_stroke}; stroke-width: 1px; rx: 3px; ry: 3px; }}
              .key-text {{ font-family: \"Space Grotesk\", system-ui, -apple-system, sans-serif; font-size: 9px; fill: {key_text_color}; font-weight: bold; text-anchor: middle; }}

              /* Dynamic HUD Value Animations */
              .score-t::after {{ content: \"0\"; animation: scoreAnim 26900ms step-end infinite; }}
              .float-t::after {{ content: \"0\"; animation: floatAnim 26900ms step-end infinite; }}
              .streak-t::after {{ content: \"0\"; animation: streakAnim 26900ms step-end infinite; }}
              .speed-t::after {{ content: \"1.0x\"; animation: speedAnim 26900ms step-end infinite; }}

              @keyframes scoreAnim {{
                0% {{ content: \"0\"; }}
                10% {{ content: \"24\"; }}
                25% {{ content: \"58\"; }}
                45% {{ content: \"86\"; }}
                65% {{ content: \"112\"; }}
                85% {{ content: \"147\"; }}
              }}
              @keyframes floatAnim {{
                0% {{ content: \"0\"; }}
                30% {{ content: \"12\"; }}
                60% {{ content: \"28\"; }}
                80% {{ content: \"42\"; }}
              }}
              @keyframes streakAnim {{
                0% {{ content: \"0\"; }}
                20% {{ content: \"2\"; }}
                40% {{ content: \"5\"; }}
                75% {{ content: \"0\"; }}
              }}
              @keyframes speedAnim {{
                0% {{ content: \"1.0x\"; }}
                35% {{ content: \"1.1x\"; }}
                70% {{ content: \"1.3x\"; }}
              }}
              '''
              svg = svg.replace('<style>', f'<style>{new_css}')
              
              # Round corners on cells
              svg = re.sub(r'\.c\{([^}]+)\}', r'.c{\1;rx:2.5px;ry:2.5px}', svg)
              
              # Glow on snake (sharper, tight)
              svg = re.sub(r'\.s\{([^}]+)\}', r'.s{\1;filter:drop-shadow(0 0 3px var(--cs))}', svg)
              
              # Glow on active keyframe cells (sharper, tight)
              svg = re.sub(r'([0-9.]+)%\{fill:(var\(--c[1-4]\))\}', r'\1%{fill:\2;filter:drop-shadow(0 0 2px \2)}', svg)
              
              # Remove cell glow on eaten
              svg = re.sub(r'([0-9.]+)%,100%\{fill:var\(--ce\)\}', r'\1%,100%{fill:var(--ce);filter:none}', svg)
              
              # Glow on initial classes (sharper, tight)
              svg = re.sub(r'\.c\.(c[0-9a-z]+)\{fill:(var\(--c[1-4]\));', r'.c.\1{fill:\2;filter:drop-shadow(0 0 2px \2);', svg)
              
              # Inject UI layout elements after </style>
              ui_elements = f'''
              <!-- Background -->
              <rect class=\"bg\" x=\"-40\" y=\"-160\" width=\"960\" height=\"400\" rx=\"16\" ry=\"16\"/>

              <!-- Starry Background -->
              <circle cx=\"60\" cy=\"-100\" r=\"1\" fill=\"#ffffff\" style=\"{star_opacity}\"/>
              <circle cx=\"180\" cy=\"-60\" r=\"1.5\" fill=\"#38bdf8\" style=\"{star_opacity}\"/>
              <circle cx=\"820\" cy=\"-120\" r=\"1\" fill=\"#ffffff\" style=\"{star_opacity}\"/>
              <circle cx=\"880\" cy=\"180\" r=\"1\" fill=\"#ffffff\" style=\"{star_opacity}\"/>
              <circle cx=\"-10\" cy=\"60\" r=\"1.5\" fill=\"#38bdf8\" style=\"{star_opacity}\"/>
              <circle cx=\"450\" cy=\"220\" r=\"1\" fill=\"#ffffff\" style=\"{star_opacity}\"/>

              <!-- Title Console -->
              <text class=\"title\" x=\"440\" y=\"-115\">⟨ ANTIGRAVITY SNAKE ⟩</text>
              <text class=\"subtitle\" x=\"440\" y=\"-93\">github contribution grid × reverse gravity</text>

              <!-- HUD Panels -->
              <g transform=\"translate(100, -75)\">
                <!-- HUD 1: Score -->
                <g transform=\"translate(0, 0)\">
                  <rect class=\"hud-box\" x=\"0\" y=\"0\" width=\"140\" height=\"34\"/>
                  <text class=\"hud-label\" x=\"15\" y=\"21\">🎯 Score</text>
                  <text class=\"hud-val\" x=\"90\" y=\"21\"><tspan class=\"score-t\"></tspan></text>
                </g>

                <!-- HUD 2: Floating -->
                <g transform=\"translate(160, 0)\">
                  <rect class=\"hud-box\" x=\"0\" y=\"0\" width=\"140\" height=\"34\"/>
                  <text class=\"hud-label\" x=\"15\" y=\"21\">🫧 Floating</text>
                  <text class=\"hud-val\" x=\"95\" y=\"21\"><tspan class=\"float-t\"></tspan></text>
                </g>

                <!-- HUD 3: Streak -->
                <g transform=\"translate(320, 0)\">
                  <rect class=\"hud-box\" x=\"0\" y=\"0\" width=\"140\" height=\"34\"/>
                  <text class=\"hud-label\" x=\"15\" y=\"21\">🔥 Streak</text>
                  <text class=\"hud-val\" x=\"95\" y=\"21\"><tspan class=\"streak-t\"></tspan></text>
                </g>

                <!-- HUD 4: Speed -->
                <g transform=\"translate(480, 0)\">
                  <rect class=\"hud-box\" x=\"0\" y=\"0\" width=\"140\" height=\"34\"/>
                  <text class=\"hud-label\" x=\"15\" y=\"21\">⚡ Speed</text>
                  <text class=\"hud-val\" x=\"90\" y=\"21\"><tspan class=\"speed-t\"></tspan></text>
                </g>
              </g>

              <!-- Grid Border -->
              <rect class=\"grid-border\" x=\"-22\" y=\"-38\" width=\"924\" height=\"204\"/>
              '''
              
              footer_elements = '''
              <!-- Controls Footer -->
              <g transform=\"translate(235, 192)\">
                <rect class=\"key-box\" x=\"0\" y=\"-12\" width=\"18\" height=\"16\"/><text class=\"key-text\" x=\"9\" y=\"0\">↑</text>
                <rect class=\"key-box\" x=\"22\" y=\"-12\" width=\"18\" height=\"16\"/><text class=\"key-text\" x=\"31\" y=\"0\">↓</text>
                <rect class=\"key-box\" x=\"44\" y=\"-12\" width=\"18\" height=\"16\"/><text class=\"key-text\" x=\"53\" y=\"0\">←</text>
                <rect class=\"key-box\" x=\"66\" y=\"-12\" width=\"18\" height=\"16\"/><text class=\"key-text\" x=\"75\" y=\"0\">→</text>
                <text class=\"footer-text\" x=\"92\" y=\"0\" text-anchor=\"start\">or</text>
                <rect class=\"key-box\" x=\"110\" y=\"-12\" width=\"18\" height=\"16\"/><text class=\"key-text\" x=\"119\" y=\"0\">W</text>
                <rect class=\"key-box\" x=\"132\" y=\"-12\" width=\"18\" height=\"16\"/><text class=\"key-text\" x=\"141\" y=\"0\">A</text>
                <rect class=\"key-box\" x=\"154\" y=\"-12\" width=\"18\" height=\"16\"/><text class=\"key-text\" x=\"163\" y=\"0\">S</text>
                <rect class=\"key-box\" x=\"176\" y=\"-12\" width=\"18\" height=\"16\"/><text class=\"key-text\" x=\"185\" y=\"0\">D</text>
                <text class=\"footer-text\" x=\"202\" y=\"0\" text-anchor=\"start\">Move</text>
                <rect class=\"key-box\" x=\"245\" y=\"-12\" width=\"45\" height=\"16\"/><text class=\"key-text\" x=\"267.5\" y=\"0\">Space</text>
                <text class=\"footer-text\" x=\"298\" y=\"0\" text-anchor=\"start\">Pause</text>
                <rect class=\"key-box\" x=\"350\" y=\"-12\" width=\"18\" height=\"16\"/><text class=\"key-text\" x=\"359\" y=\"0\">R</text>
                <text class=\"footer-text\" x=\"376\" y=\"0\" text-anchor=\"start\">Reset</text>
              </g>
              '''
              
              style_end = svg.find('</style>')
              if style_end != -1:
                  insert_pos = style_end + len('</style>')
                  svg = svg[:insert_pos] + ui_elements + '<g transform=\"translate(0, 0)\">' + svg[insert_pos:]
                  svg = svg.replace('</svg>', f'</g>{footer_elements}</svg>')
              
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(svg)
              print(f'Successfully processed {filename}')
          "

      - name: Push Snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true   # Keep existing files — never wipe
          jekyll: false        # Disable Jekyll so SVGs are served raw
          commit_message: "chore: regenerate contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
